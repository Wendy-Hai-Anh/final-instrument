<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden of Sounds</title>
    <link rel="stylesheet" href="base.css?v=scene-previews-20261024">
    <link rel="stylesheet" href="style.css?v=scene-previews-20261024">
    <script src="storybook.js" defer></script>
</head>

<body class="storybookPage">
    <!--
    This page is the cover of a storybook. Starting the story opens the book on the first garden,
    and each garden preview opens one of the three gardens.
    -->

    <main class="storybookCover">
        <!-- The closed book carries the title. The open book stays hidden until it opens. -->
        <h1 class="storybook">
            <img class="bookOpen" src="assets/storybook/book-open.webp" alt="" width="1740"
                height="1140">
            <img class="bookCover" src="assets/storybook/book-closed.webp" alt="Garden of Sounds"
                width="870" height="1140">
        </h1>

        <nav class="chapterMenu" aria-label="Gardens">
            <a class="startSign" href="versions/lakeside-picnic/index.html?v=scene-previews-20261024" data-opens-book>
                <img class="buttonImage" src="assets/storybook/sign-start.webp" alt="Start now"
                    width="720" height="810">
                <img class="buttonHover" src="assets/storybook/sign-start-hover.webp" alt=""
                    width="720" height="810">
            </a>

            <!-- Each chapter is one garden, joined in order like a path through the book. -->
            <ol class="chapterList">
                <li>
                    <a class="chapterLink" href="versions/lakeside-picnic/index.html?v=scene-previews-20261024"
                        data-opens-book>
                        <span class="chapterDot">
                            <img class="buttonImage chapterPreview"
                                src="versions/lakeside-picnic/assets/backgrounds/wide.webp"
                                alt="" width="200" height="200">
                        </span>
                        Lakeside picnic
                    </a>
                </li>
                <li>
                    <a class="chapterLink" href="versions/painted-orchard/index.html?v=scene-previews-20261024"
                        data-opens-book>
                        <span class="chapterDot">
                            <img class="buttonImage chapterPreview"
                                src="versions/painted-orchard/assets/backgrounds/wide.webp"
                                alt="" width="200" height="200">
                        </span>
                        Painted orchard
                    </a>
                </li>
                <li>
                    <a class="chapterLink" href="versions/flower-meadow/index.html?v=scene-previews-20261024"
                        data-opens-book>
                        <span class="chapterDot">
                            <img class="buttonImage chapterPreview"
                                src="versions/flower-meadow/assets/backgrounds/wide.webp"
                                alt="" width="200" height="200">
                        </span>
                        Giant flower meadow
                    </a>
                </li>
            </ol>
        </nav>

        <p class="grownUpNote">
            Each garden holds the same ten objects: four gardening tools, three animals and three
            fruits. Tap an object to start or stop its sound, and drag it to move it. Higher places
            play higher notes, and places further right repeat faster.
        </p>
    </main>
</body>

</html>
